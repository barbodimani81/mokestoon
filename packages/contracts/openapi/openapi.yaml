openapi: 3.0.3
info:
  title: F7 API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /health/live:
    get:
      operationId: getLiveness
      summary: Check whether the API is serving requests
      security: []
      responses:
        '200':
          description: API is live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Live' }
  /health/ready:
    get:
      operationId: getReadiness
      summary: Check whether the API can reach PostgreSQL
      security: []
      responses:
        '200':
          description: PostgreSQL accepts a round trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ready' }
        '503':
          description: PostgreSQL unavailable or probe timed out
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Unavailable' }
  /leaderboard:
    get:
      operationId: getLeaderboard
      summary: All-time F7 Score rankings within the viewer's authorized audience
      security: [{ accessCookie: [] }]
      parameters:
        - { in: header, name: X-F7-Player, schema: { type: string, format: uuid } }
        - { in: query, name: scope, schema: { type: string, enum: [group, global] } }
        - { in: query, name: group_id, schema: { type: string, format: uuid } }
        - { in: query, name: period, schema: { type: string, enum: [all_time] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: cursor, schema: { type: string, maxLength: 75 } }
      responses:
        '200':
          description: Authorized standings
          content:
            application/json: { schema: { $ref: '#/components/schemas/Standings' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /me:
    get:
      operationId: getAccountProfile
      security: [{ accessCookie: [] }]
      responses:
        '200':
          description: Verified private account profile
          content:
            application/json: { schema: { $ref: '#/components/schemas/AccountProfile' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/register:
    post:
      operationId: requestRegistration
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccountEmail' } }
      responses:
        '202':
          description: Request accepted
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CompleteEmailChallenge' } }
      responses:
        '204':
          description: Session cookies updated
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/password/forgot:
    post:
      operationId: requestPasswordReset
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccountEmail' } }
      responses:
        '202':
          description: Request accepted
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/password/reset:
    post:
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/CompleteEmailChallenge' } }
      responses:
        '204':
          description: Session cookies updated
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AccountLogin' } }
      responses:
        '204':
          description: Session cookies updated
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/refresh:
    post:
      operationId: rotateSession
      security: [{ refreshCookie: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Empty' } }
      responses:
        '204':
          description: Session cookies updated
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /auth/logout:
    post:
      operationId: logout
      security: [{ refreshCookie: [] }]
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/Empty' } }
      responses:
        '204':
          description: Session cookies updated
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '429': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /catalog/unlocks:
    get:
      operationId: listUnlocks
      summary: List enabled development unlocks
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Catalog' }
        '403':
          $ref: '#/components/responses/Failure'
  /development/session:
    post:
      operationId: startPlaytest
      summary: Start or reuse a loopback-only development session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Empty' }
      responses:
        '204':
          description: Success
        '400':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '415':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
  /players/me:
    patch:
      operationId: changeDisplayName
      security: [{ accessCookie: [] }]
      parameters:
        - { in: header, name: X-F7-Player, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ProfileUpdate' } }
      responses:
        '204': { description: Display name updated }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
    get:
      operationId: getPlayer
      summary: Read authenticated player totals and ownership
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Player' }
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
  /players/me/wallet/transactions:
    get:
      operationId: getWalletHistory
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      parameters:
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Authenticated player data
          content:
            application/json: { schema: { $ref: '#/components/schemas/WalletHistory' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
  /players/me/unlocks:
    get:
      operationId: getOwnedUnlocks
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      responses:
        '200':
          description: Authenticated player data
          content:
            application/json: { schema: { $ref: '#/components/schemas/OwnedUnlocks' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
  /players/me/save:
    get:
      operationId: getPlayerSave
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      parameters:
        - { in: header, name: X-F7-Player, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Versioned apartment checkpoint
          content:
            application/json: { schema: { $ref: '#/components/schemas/PlayerSave' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
        '404': { $ref: '#/components/responses/Failure' }
    put:
      operationId: updatePlayerSave
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      parameters:
        - { in: header, name: X-F7-Player, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SaveUpdate' } }
      responses:
        '200':
          description: Versioned apartment checkpoint
          content:
            application/json: { schema: { $ref: '#/components/schemas/PlayerSave' } }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '409': { $ref: '#/components/responses/Failure' }
        '503': { $ref: '#/components/responses/Failure' }
        '400': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
  /purchases:
    post:
      operationId: buyUnlock
      summary: Buy an unlock with Faaz
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      parameters:
        - in: header
          name: X-F7-Player
          required: true
          schema: { type: string, format: uuid }
          description: Reject replay after the authenticated player changes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Purchase' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseResult' }
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '415':
          $ref: '#/components/responses/Failure'
        '422':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
  /game-events/batch:
    post:
      operationId: syncEvents
      summary: Validate a bounded batch of completed requests
      security: [{ playtestCookie: [] }, { accessCookie: [] }]
      parameters:
        - in: header
          name: X-F7-Player
          required: true
          schema: { type: string, format: uuid }
          description: Reject replay after the authenticated player changes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EventBatch' }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResult' }
        '400':
          $ref: '#/components/responses/Failure'
        '401':
          $ref: '#/components/responses/Failure'
        '403':
          $ref: '#/components/responses/Failure'
        '409':
          $ref: '#/components/responses/Failure'
        '415':
          $ref: '#/components/responses/Failure'
        '422':
          $ref: '#/components/responses/Failure'
        '503':
          $ref: '#/components/responses/Failure'
components:
  securitySchemes:
    accessCookie: { type: apiKey, in: cookie, name: f7_access }
    refreshCookie: { type: apiKey, in: cookie, name: f7_refresh }
    playtestCookie: { type: apiKey, in: cookie, name: f7_playtest }
  responses:
    Failure:
      description: Request rejected or service unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Live:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [live] }
    Ready:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ready] }
    Unavailable:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [unavailable] }

    WalletTransaction:
      type: object
      required: [event_id, event_type, reason, amount_faaz, created_at]
      properties:
        event_id: { type: string, format: uuid }
        event_type: { type: string, enum: [request_completed, purchase] }
        reason: { type: string }
        amount_faaz: { type: integer }
        created_at: { type: string, format: date-time }
    WalletHistory:
      type: object
      required: [transactions]
      properties:
        transactions: { type: array, items: { $ref: '#/components/schemas/WalletTransaction' } }
        next_cursor: { type: string, format: uuid }
    OwnedUnlocks:
      type: object
      required: [unlocks]
      properties:
        unlocks: { type: array, items: { type: string } }
    ApartmentCheckpoint:
      $ref: '../../../apps/api/internal/saves/checkpoint.schema.json'
    SaveUpdate:
      type: object
      additionalProperties: false
      required: [expected_version, schema_version, payload]
      properties:
        expected_version: { type: integer, minimum: 0, maximum: 9007199254740990 }
        schema_version: { type: integer, enum: [1] }
        payload: { $ref: '#/components/schemas/ApartmentCheckpoint' }
    PlayerSave:
      type: object
      required: [version, schema_version, payload, updated_at]
      properties:
        version: { type: integer, minimum: 1 }
        schema_version: { type: integer, enum: [1] }
        updated_at: { type: string, format: date-time }
        payload: { $ref: '#/components/schemas/ApartmentCheckpoint' }
    Empty: { type: object, additionalProperties: false }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id, details]
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string, format: uuid }
            details: { type: array, items: { type: string } }
    Unlock:
      type: object
      required: [id, name, cost_faaz, prerequisites]
      properties:
        id: { type: string }
        name: { type: string }
        cost_faaz: { type: integer, minimum: 0 }
        prerequisites: { type: array, items: { type: string } }
    Standing:
      type: object
      additionalProperties: false
      required: [rank, display_name, f7_score]
      properties:
        rank: { type: integer, minimum: 1 }
        display_name: { type: string, nullable: true }
        f7_score: { type: integer, minimum: 0 }
    Standings:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: '#/components/schemas/Standing' } }
        next_cursor: { type: string }
    AccountEmail:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }
    AccountLogin:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, format: password, maxLength: 256 }
    CompleteEmailChallenge:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, minLength: 87, maxLength: 87 }
        password: { type: string, format: password, minLength: 12, maxLength: 256 }
    ProfileUpdate:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 32 }
    AccountProfile:
      type: object
      required: [player_id, email, display_name]
      properties:
        display_name: { type: string, maxLength: 32 }
        player_id: { type: string, format: uuid }
        email: { type: string, format: email }
    Catalog:
      type: object
      required: [development, unlocks]
      properties:
        development: { type: boolean }
        email_accounts: { type: boolean }
        unlocks: { type: array, items: { $ref: '#/components/schemas/Unlock' } }
    Player:
      type: object
      required: [player_id, faaz, f7_score, unlocks]
      properties:
        player_id: { type: string, format: uuid }
        faaz: { type: integer, minimum: 0 }
        f7_score: { type: integer, minimum: 0 }
        unlocks: { type: array, items: { type: string } }
    PurchaseResult:
      allOf:
        - { $ref: '#/components/schemas/Player' }
        - type: object
          required: [purchase_id, unlock_id, purchased_at]
          properties:
            purchase_id: { type: string, format: uuid }
            unlock_id: { type: string }
            purchased_at: { type: string, format: date-time }
    Purchase:
      type: object
      additionalProperties: false
      required: [idempotency_key, unlock_id]
      properties:
        idempotency_key: { type: string, format: uuid }
        unlock_id: { type: string, minLength: 1, maxLength: 128 }
    RequestCompletion:
      type: object
      additionalProperties: false
      required: [event_id, request_id, character_id, activity_id, duration_ticks]
      properties:
        event_id: { type: string, format: uuid }
        request_id: { type: string, format: uuid }
        character_id: { type: string, enum: [barbod, kavian, mahan, parsa, parham] }
        activity_id: { type: string, minLength: 1, maxLength: 128 }
        duration_ticks: { type: integer, minimum: 1, maximum: 36000 }
    EventBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events: { type: array, minItems: 1, maxItems: 32, items: { $ref: '#/components/schemas/RequestCompletion' } }
    BatchResult:
      type: object
      required: [player, outcomes]
      properties:
        player: { $ref: '#/components/schemas/Player' }
        outcomes:
          type: array
          items:
            type: object
            required: [event_id, status, amount_faaz]
            properties:
              event_id: { type: string, format: uuid }
              status: { type: string, enum: [accepted, rejected, conflict] }
              amount_faaz: { type: integer, minimum: 0, description: Original posted Faaz for this receipt. Zero for unsuccessful outcomes. }
